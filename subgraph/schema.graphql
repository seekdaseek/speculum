# speculum — subgraph schema
#
# The question this answers is not what happened, but which agents say one
# thing and do another, and how often. Raw events do not answer that; running
# aggregates on the agent do.

type Agent @entity(immutable: false) {
  id: Bytes!
  firstSeen: BigInt!
  lastSeen: BigInt!

  checks: BigInt!
  passed: BigInt!
  blocked: BigInt!
  refused: BigInt!

  """
  Blocked plus refused over total. Stored rather than computed at query time,
  because sorting agents by it is the entire point of this entity.
  """
  divergenceRate: BigDecimal!

  """
  How many of this agent's blocks a human then approved anyway. A high number
  means the gate is too strict. A low one means it is catching real problems.
  """
  overridden: BigInt!

  declarations: BigInt!

  """
  Checks recorded with no prior declaration from this agent. An intent
  published only after the calldata exists proves nothing, because it could
  have been written to fit.
  """
  undeclared: BigInt!

  checkList: [Check!]! @derivedFrom(field: "agent")
}

type Check @entity(immutable: true) {
  id: Bytes!
  agent: Agent!
  intentHash: Bytes!
  deedHash: Bytes!
  target: Bytes!

  "PASS, BLOCK or REFUSE"
  level: String!
  levelCode: Int!

  "Divergence class names, decoded from the bitfield the contract emits."
  findings: [String!]!
  findingBits: Int!

  "True when any finding is one that cannot be undone once mined."
  irreversible: Boolean!

  "Whether THIS exact intent hash was declared on chain before this check was recorded."
  declaredFirst: Boolean!

  blockNumber: BigInt!
  timestamp: BigInt!
  txHash: Bytes!
}

type Declaration @entity(immutable: true) {
  id: Bytes!
  agent: Agent!
  intentHash: Bytes!
  nonce: BigInt!
  blockNumber: BigInt!
  timestamp: BigInt!
}

type Override @entity(immutable: true) {
  id: Bytes!
  deedHash: Bytes!
  approver: Bytes!

  "The check this override answers, when one is known."
  check: Check

  """
  True when a human approved a deed the gate never checked. That means
  something reached a signer around the gate, which is a finding in itself and
  the reason this field exists.
  """
  unchecked: Boolean!

  blockNumber: BigInt!
  timestamp: BigInt!
}

"One row of counters, so a dashboard need not scan every Check."
type Totals @entity(immutable: false) {
  id: Bytes!
  checks: BigInt!
  passed: BigInt!
  blocked: BigInt!
  refused: BigInt!
  overrides: BigInt!
  uncheckedOverrides: BigInt!
  agents: BigInt!
}

"""
Lookup from a deed hash to the check that judged it.

Overrides arrive keyed by deed hash while checks are keyed by log position, so
without this there is no way to connect a human approval to the verdict it
answers.

A deed hash is not a unique key for a check. The same calldata can be judged
against different declarations and reach opposite verdicts, so this holds the
most recent one. That makes ordering load bearing: a verdict must be recorded
before the human is asked about it, or the override resolves against a stale
check. The first version of these mappings hardcoded every override as
unchecked because this lookup did not exist, which meant the field reported a
gate bypass on every legitimate approval. A field that is always true carries
no information and actively misleads.
"""
type DeedIndex @entity(immutable: false) {
  id: Bytes!
  "The most recent check for this deed hash."
  check: Check!
  agent: Agent!
}

"""
Lookup from an intent hash to its declaration, so a check can prove that this
exact intent was declared before the calldata was judged, rather than only that
the agent had declared something at some point.
"""
type IntentIndex @entity(immutable: false) {
  id: Bytes!
  declaredAtBlock: BigInt!
  agent: Agent!
}

"Running count per divergence class, so what goes wrong most is one query."
type FindingCount @entity(immutable: false) {
  id: String!
  bit: Int!
  count: BigInt!
  irreversible: Boolean!
}
